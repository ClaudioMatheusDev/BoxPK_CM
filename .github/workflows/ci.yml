name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore src/BoxPKCM.sln
      - run: dotnet build src/BoxPKCM.sln --no-restore -c Release
      - run: dotnet test src/BoxPKCM.sln --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/FrontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/FrontEnd/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
